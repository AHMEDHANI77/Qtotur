name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # تحديث إلى Java 21 لأن الإصدارات الحديثة من AGP و KSP تتطلبها للاستقرار
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix KSP Environment & Properties
        # حقن خيارات داخل الـ Properties لإجبار الكومبيلر على العمل في بيئة معزولة ونظيفة
        run: |
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties

      - name: Build with Required Gradle Version
        run: |
          # توليد الـ Wrapper المتوافق
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # البناء مع عزل تام للـ Daemon وتخطي الفحوصات الثانوية والاختبارات
          ./gradlew assembleDebug -x test -x lint -x lintVitalRelease --no-daemon --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: "**/build/outputs/apk/debug/*.apk"
