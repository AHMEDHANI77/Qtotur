name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Required Gradle Version
        run: |
          # توليد الـ Wrapper بإصدار 9.3.1 المتوافق إجبارياً مع AGP 9.1.1 المكتوب في كودك
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # البدء في البناء الفعلي مع تخطي الفحوصات الجانبية
          ./gradlew assembleDebug -x test -x lint -x lintVitalRelease --no-daemon
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: "**/build/outputs/apk/debug/*.apk"
