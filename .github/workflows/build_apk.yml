name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK without Custom Signing
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # نستخدم أمر البناء مع تمرير بارامتر لإجبار النظام على استخدام التوقيع الافتراضي
          # وتجاهل إعدادات 'debugConfig' المفقودة
          ./gradlew assembleDebug \
            -Pandroid.injected.signing.config.file="" \
            -x test -x lint -x validateSigningDebug \
            --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Qtotur-App-Success
          path: "**/build/outputs/apk/debug/*.apk"
