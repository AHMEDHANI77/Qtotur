name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # استخدام Java 21 ضروري جداً لإصدارات مشروعك (Kotlin 2.2.10 و AGP 9.1.1)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Environment & Memory
        # تخصيص إعدادات الذاكرة والـ KSP مباشرة قبل البناء
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties

      - name: Build APK with Detailed Logging
        run: |
          # توليد الـ Wrapper بالإصدار الذي طلبه المحرك في سجلاتك (9.3.1)
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # تنفيذ البناء مع تعطيل الـ Cache المسبب للمشاكل وتخطي الفحوصات الثانوية
          ./gradlew assembleDebug \
            -x test \
            -x lint \
            -x lintVitalRelease \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace
          
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Qtotur-App-Release
          path: "**/build/outputs/apk/debug/*.apk"
