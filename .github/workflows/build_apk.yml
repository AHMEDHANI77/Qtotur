name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Custom Wrapper
        run: |
          # توليد الـ Wrapper بإصدار مستقر ومتوافق مع مشاريع جوجل الحديثة
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          
          # البناء مع تفعيل خيارات التخطي القصوى والتمرير السريع
          ./gradlew assembleDebug -x test -x lint -x lintVitalRelease --continue --no-daemon
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: "**/build/outputs/apk/debug/*.apk"
