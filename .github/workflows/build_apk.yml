name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # زيادة الصلاحيات لضمان عدم حظر العمليات الخلفية
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4 # تحديث للإصدار v4 المستقر

      - name: Force Clean Environment & KSP Fix
        # هذا الجزء سيقوم بتعديل gradle.properties لتعطيل الخصائص التي تسبب الـ NullPointerException في KSP
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" > gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          # إضافة السطر السحري لحل مشكلة الـ ApplicationManager في بيئات CI
          echo "org.gradle.vfs.watch=false" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties

      - name: Build APK
        run: |
          # استخدام الإصدار 9.3.1 كما طلبت بيئة بناء AGP 9.1.1 في صورك السابقة
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # تشغيل البناء مع تصفير الـ Cache المعطوب
          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace \
            -x test \
            -x lint \
            -Pkotlin.daemon.jvmargs="-Xmx2g"
          
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Qtotur-App-Debug
          path: "app/build/outputs/apk/debug/*.apk"
