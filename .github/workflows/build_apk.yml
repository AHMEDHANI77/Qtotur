name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # استخدام Java 21 ضروري جداً لإصدار AGP 9.1.1 وكوتلن 2.2.10
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Environment
        run: |
          # حقن إعدادات الذاكرة والـ KSP لتتوافق مع إصدار 2.3.5 المذكور
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties
          # تفعيل ميزة الـ R Class التي يطلبها AGP الحديث
          echo "android.nonTransitiveRClass=true" >> gradle.properties

      - name: Build APK with Gradle 9.3.1+
        run: |
          # توليد الـ Wrapper بإصدار حديث يتوافق مع متطلبات AGP 9.1.1
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # تنفيذ عملية البناء مع تخطي الاختبارات لضمان السرعة وتجاوز مشاكل الـ Robolectric محلياً
          ./gradlew assembleDebug -x test -x lint -x lintVitalRelease --no-daemon --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qtotur-Project-APK
          path: "**/build/outputs/apk/debug/*.apk"
